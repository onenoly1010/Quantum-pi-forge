version: '3.8'

services:
  # The Brain: Local Inference Engine
  ollama:
    image: ollama/ollama:latest
    container_name: oinio-brain
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # The Memory: Local Vector Database (RAG for your 28 repos)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: oinio-memory
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # The Orchestrator: Multi-Agent UI (Open WebUI)
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: oinio-commander
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENABLE_SIGNUP=false
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
    volumes:
      - webui_data:/app/backend/data
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
  qdrant_data:
  webui_data: