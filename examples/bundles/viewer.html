<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Quantum Pi Forge Evidence Viewer</title>
<style>body{font-family:monospace;background:#0a0c10;color:#e0e0e0;max-width:1200px;margin:auto;padding:20px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #333;padding:8px;vertical-align:top}.pass{color:#4caf50}.fail{color:#f44336}.refused{color:#ff9800}pre{background:#111;padding:10px;overflow:auto}</style></head><body>
<h1>Quantum Pi Forge Evidence Bundle Viewer</h1><input type="file" id="f" accept=".json"><div id="out"><p>Select a bundle JSON.</p></div>
<script>const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));document.getElementById("f").onchange=async e=>{let data=JSON.parse(await e.target.files[0].text());let packets=Array.isArray(data)?data:(data.packets||[]);let rows=packets.map(p=>`<tr><td>${esc(p.request_id)}</td><td class="${esc(p.status)}">${esc(p.status)}</td><td>${esc(p.summary)}</td><td><pre>${esc(JSON.stringify(p.evidence||[],null,2))}</pre></td><td><pre>${esc(JSON.stringify(p.risks||[],null,2))}</pre></td></tr>`).join("");let fail=packets.filter(p=>p.status==="fail").length;document.getElementById("out").innerHTML=`<h2>Total ${packets.length} | Failed ${fail}</h2><p>Read-only audit: no wallet signing, deployment, funds movement, governance execution, or chain mutation.</p><table><tr><th>Claim</th><th>Status</th><th>Summary</th><th>Evidence</th><th>Risks</th></tr>${rows}</table>`}</script>
</body></html>
