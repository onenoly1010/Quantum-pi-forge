name: CI Healthcheck

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    env:
      ENABLE_TELEMETRY: false  # Disable OpenTelemetry in CI environment
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "server/requirements.txt" ]; then
            pip install -r server/requirements.txt
          else
            pip install fastapi[all] pytest httpx
          fi

      - name: Run health tests
        run: |
          if [ -f tests/test_health.py ]; then
            pytest -q tests/test_health.py
          else
            echo "tests/test_health.py not found; skipping healthcheck for this PR."
          fi
