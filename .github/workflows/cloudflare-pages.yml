name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'public/**'
      - 'src/**'
      - 'app/**'
      - 'pages/**'
      - 'components/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.js'
      - 'next.config.mjs'
      - 'vite.config.ts'
      - 'wrangler.toml'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build and Deploy Pages
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static Pages output
        run: npm run build
        env:
          DEPLOY_TARGET: cloudflare-pages
          NODE_ENV: production

      - name: Verify Pages artifacts
        run: |
          test -f out/index.html
          test -f out/_redirects
          find out -maxdepth 2 -type f | sort | sed -n '1,120p'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: quantumpiforge
          directory: out
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
