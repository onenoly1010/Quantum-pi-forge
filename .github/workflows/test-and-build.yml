name: Test and Build

on:
  push:
    branches:
      - '*'
      - '!main'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static assets
        run: npm run build

  build-and-package:
    name: Build and Package
    runs-on: ubuntu-22.04
    needs: lint-and-test
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static assets
        run: npm run build

      - name: Verify output directory
        run: |
          test -d out
          test -f out/index.html
          find out -maxdepth 2 -type f | sort | sed -n '1,80p'

  health-check:
    name: API Health Check
    runs-on: ubuntu-22.04
    needs: lint-and-test
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify static health artifacts
        run: |
          test -f deploy/index.html
          test -f scripts/build.js
          test -f package.json
          echo "Static build health inputs present"
