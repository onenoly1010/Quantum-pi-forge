name: Forgejo Local Proof & Build

on:
  push:
    branches:
      - main
      - ops/forgejo-actions-proof-v1
      - docs/reviewer-proof-matrix-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: https://github.com/actions/checkout@v4

      - name: Setup Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version: 22

      - name: Show environment
        run: |
          echo "=== Forgejo Local Proof & Build ==="
          uname -a
          pwd
          node --version
          npm --version
          git rev-parse HEAD

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build static assets
        run: npm run build

      - name: Run non-blocking verification scripts
        run: |
          npm run verify:evidence || true
          npm run verify:receipt || true
          npm run claim-map:check || true

      - name: Verify reviewer canon files
        run: |
          test -s README.md
          test -s REVIEWER_START_HERE.md
          test -s docs/review/CLAIM_TO_PROOF_MATRIX.md
          test -s contracts/DEPLOYED_ADDRESSES.md

          grep -n "Reviewer Canon" README.md
          grep -n "Claim-to-Proof Matrix" README.md
          grep -n "Site Integration Note" docs/review/CLAIM_TO_PROOF_MATRIX.md
          grep -n "does not claim deployment" contracts/DEPLOYED_ADDRESSES.md
          grep -n "0G Aristotle Mainnet" contracts/DEPLOYED_ADDRESSES.md

      - name: Emit Forgejo proof receipt
        run: |
          mkdir -p receipts/forgejo
          {
            echo "{"
            echo "  \"workflow\": \"Forgejo Local Proof & Build\","
            echo "  \"status\": \"completed\","
            echo "  \"scope\": \"build-reviewer-canon-and-nonblocking-verification\","
            echo "  \"runner\": \"forgejo-compatible\","
            echo "  \"git_sha\": \"$(git rev-parse HEAD)\","
            echo "  \"branch\": \"${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-unknown}}\","
            echo "  \"timestamp_utc\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\""
            echo "}"
          } > receipts/forgejo/local-proof-receipt.json

          echo "=== Forgejo Local Proof Receipt ==="
          cat receipts/forgejo/local-proof-receipt.json
